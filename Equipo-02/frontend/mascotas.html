<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Veterinaria - Mascotas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand"><h2>🐾 Patitas</h2></div>
            <nav class="nav-menu">
                <a href="home.html" class="nav-item">🏠 Inicio</a>
                <a href="mascotas.html" class="nav-item active">🐶 Mascotas</a>
            </nav>
            <button id="btn-logout" class="btn btn-logout">Cerrar Sesión</button>
        </aside>
        
        <main class="main-content">
            <header class="topbar"><h1>Gestión de Mascotas</h1></header>
            
            <section class="card">
                <h2>Registrar Mascota</h2>
                <form id="form-mascota" class="grid-form">
                    <div class="form-group">
                        <label>Nombre:</label>
                        <input type="text" id="mascota-nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Raza:</label>
                        <input type="text" id="mascota-raza" required>
                    </div>
                    <div class="form-group">
                        <label>Peso (kg):</label>
                        <input type="number" step="0.1" id="mascota-peso" required>
                    </div>
                    <div class="form-group">
                        <label>Género:</label>
                        <select id="mascota-genero" required>
                            <option value="Macho">Macho</option>
                            <option value="Hembra">Hembra</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Apoderado (dueño):</label>
                        <select id="mascota-apoderado" required>
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Guardar en Base de Datos</button>
                    </div>
                </form>
            </section>

            <section class="card mt-2">
                <h2>Mascotas en Base de Datos</h2>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>Nombre</th><th>Raza</th><th>Peso</th><th>Género</th><th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="mascotas-table-body">
                        <tr><td colspan="6" style="text-align:center;">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="js/mascotas.js"></script>
    <script>
        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.clear(); window.location.href = 'index.html';
        });
    </script>
</body>
</html>
