<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Cuenta - Veterinaria</title>
    <link rel="stylesheet" href="../Css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Registrar Nueva Cuenta</h2>
        
        <form id="form-agregar-cuenta">
            <div class="form-group">
                <label for="username">Nombre de Usuario:</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <!-- Agrega aquí más campos si tu modelo 'Usuario.java' los requiere (ej. email, rol) -->

            <button type="submit" class="btn-guardar">Guardar Cuenta</button>
        </form>

        <div id="mensaje-respuesta" style="margin-top: 15px;"></div>
        
        <a href="index.html" class="link-volver">Volver al inicio</a>
    </div>

    <!-- Enlazamos la lógica de JavaScript -->
    <script src="../JavaScript/agregar_cuenta.js"></script>
</body>
</html>
