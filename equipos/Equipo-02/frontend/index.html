<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="auth-container">
        <!-- Formulario de Login -->
        <div id="login-form-wrapper" class="auth-box active">
            <h2>Iniciar Sesión 🐾</h2>
            <div id="login-error" class="alert error" style="display:none;"></div>
            <form id="login-form">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="login-username" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
            </form>
            <p class="switch-form">¿No tienes cuenta? <a href="#" id="show-register">Regístrate</a></p>
        </div>

        <!-- Formulario de Registro -->
        <div id="register-form-wrapper" class="auth-box">
            <h2>Registrarse 🐾</h2>
            <div id="register-error" class="alert error" style="display:none;"></div>
            <div id="register-success" class="alert success" style="display:none;"></div>
            <form id="register-form">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="reg-username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="reg-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Crear Cuenta</button>
            </form>
            <p class="switch-form">¿Ya tienes cuenta? <a href="#" id="show-login">Inicia Sesión</a></p>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
